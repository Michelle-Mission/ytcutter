name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: v1.0.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.8'

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > dev.keystore
            echo "keystore restored"
          else
            echo "no KEYSTORE_BASE64 secret; release will use debug signing"
          fi

      - name: Version
        id: ver
        run: |
          echo "name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
          echo "code=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Build
        run: gradle --no-daemon testDebugUnitTest assembleRelease

      - name: Release asset
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: |
          cp app/build/outputs/apk/release/app-release.apk "YT-Cutter-${{ steps.ver.outputs.name }}.apk"

      - name: Previous build
        id: prev
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        run: |
          set -e
          NEW="${{ steps.ver.outputs.code }}"
          PREV=$((NEW - 1))
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/YT-Cutter-${{ steps.ver.outputs.name }}.apk"
          ok=0
          for i in $(seq 1 12); do
            if curl -fsSL -o prev.apk "$URL"; then ok=1; break; fi
            sleep 10
          done
          [ "$ok" = "1" ] || exit 0
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | tail -1)
          CODE=$("$AAPT" dump badging prev.apk 2>/dev/null | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
          if [ -z "$CODE" ] || [ "$CODE" != "$PREV" ]; then exit 0; fi
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "previous versionCode: $CODE (dari aset rilis yang sama)"

      - name: Delta patch
        id: delta
        if: (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && steps.prev.outputs.code != ''
        env:
          PREV_CODE: ${{ steps.prev.outputs.code }}
          NEW_CODE: ${{ steps.ver.outputs.code }}
          VNAME: ${{ steps.ver.outputs.name }}
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq bsdiff
          APK="YT-Cutter-${VNAME}.apk"
          PATCH="update-b${NEW_CODE}-from-b${PREV_CODE}.patch"
          bsdiff prev.apk "$APK" "$PATCH"
          echo "patch=$PATCH" >> "$GITHUB_OUTPUT"
          echo "prev=$PREV_CODE" >> "$GITHUB_OUTPUT"
          python3 -c "import os;print('patch bytes:', os.path.getsize('$PATCH'))"

      - name: Manifest
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          TAG: ${{ env.RELEASE_TAG }}
          VNAME: ${{ steps.ver.outputs.name }}
          VCODE: ${{ steps.ver.outputs.code }}
          PATCH_NAME: ${{ steps.delta.outputs.patch }}
          PREV_CODE: ${{ steps.delta.outputs.prev }}
        run: |
          python3 - "$OWNER" "$REPO" "$TAG" "$VNAME" "$VCODE" "$PATCH_NAME" "$PREV_CODE" <<'PY'
          import hashlib, json, os, sys
          owner, repo, tag, vname, code, patch, prev = sys.argv[1:8]
          apk = f"YT-Cutter-{vname}.apk"
          try:
              notes = open("RELEASE_NOTES.md").read().strip()
          except FileNotFoundError:
              notes = ""
          notes = notes or "Lihat catatan rilis di halaman GitHub."
          base = f"https://github.com/{owner}/{repo}/releases/download/{tag}"
          data = {
              "versionName": vname,
              "versionCode": int(code),
              "notes": notes,
              "apk": {
                  "name": apk,
                  "url": f"{base}/{apk}",
                  "sha256": hashlib.sha256(open(apk, "rb").read()).hexdigest(),
                  "size": os.path.getsize(apk),
              },
          }
          if patch and prev:
              data["patch"] = {
                  "name": patch,
                  "url": f"{base}/{patch}",
                  "sha256": hashlib.sha256(open(patch, "rb").read()).hexdigest(),
                  "size": os.path.getsize(patch),
                  "fromVersionCode": int(prev),
              }
          json.dump(data, open("update.json", "w"), indent=2)
          print(open("update.json").read())
          PY

      - name: Attach release files
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: RELEASE_NOTES.md
          make_latest: true
          files: |
            YT-Cutter-*.apk
            update.json
            update-b*-from-b*.patch

      - name: Hapus patch lama
        if: (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && steps.delta.outputs.patch != ''
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: ${{ steps.delta.outputs.patch }}
        run: |
          LIST=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases?per_page=5" || true)
          printf '%s' "$LIST" | python3 -c "
          import sys, json
          keep = '$KEEP'
          try: rs = json.load(sys.stdin)
          except Exception: rs = []
          for r in rs:
              if r.get('draft'): continue
              for a in r.get('assets', []):
                  if a['name'].startswith('update-b') and a['name'] != keep:
                      print(a['id'])
          " | while read -r id; do
            [ -n "$id" ] && curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$id" -o /dev/null
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ytcutter-apk
          path: app/build/outputs/apk/release/app-release.apk