name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.8'

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > dev.keystore
            echo "keystore restored"
          else
            echo "no KEYSTORE_BASE64 secret; release will use debug signing"
          fi

      - name: Version
        id: ver
        run: |
          echo "name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
          echo "code=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Build
        run: gradle --no-daemon testDebugUnitTest assembleRelease

      - name: Release asset
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cp app/build/outputs/apk/release/app-release.apk "YT-Cutter-${{ steps.ver.outputs.name }}.apk"

      - name: Manifest
        if: startsWith(github.ref, 'refs/tags/')
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          TAG: ${{ github.ref_name }}
          VNAME: ${{ steps.ver.outputs.name }}
          VCODE: ${{ steps.ver.outputs.code }}
        run: |
          python3 - "$OWNER" "$REPO" "$TAG" "$VNAME" "$VCODE" <<'PY'
          import hashlib, json, os, sys
          owner, repo, tag, vname, code = sys.argv[1:6]
          apk = f"YT-Cutter-{vname}.apk"
          data = {
              "versionName": vname,
              "versionCode": int(code),
              "notes": "Lihat catatan rilis di halaman GitHub.",
              "apk": {
                  "name": apk,
                  "url": f"https://github.com/{owner}/{repo}/releases/download/{tag}/{apk}",
                  "sha256": hashlib.sha256(open(apk, "rb").read()).hexdigest(),
                  "size": os.path.getsize(apk),
              },
          }
          json.dump(data, open("update.json", "w"), indent=2)
          print(open("update.json").read())
          PY

      - name: Attach release files
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            YT-Cutter-*.apk
            update.json

      - uses: actions/upload-artifact@v4
        with:
          name: ytcutter-apk
          path: app/build/outputs/apk/release/app-release.apk
