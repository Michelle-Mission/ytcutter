name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.8'

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > dev.keystore
            echo "keystore restored"
          else
            echo "no KEYSTORE_BASE64 secret; release will use debug signing"
          fi

      - name: Build
        run: gradle --no-daemon testDebugUnitTest assembleRelease

      - name: Release asset name
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp app/build/outputs/apk/release/app-release.apk "YT-Cutter-${GITHUB_REF_NAME#v}.apk"

      - name: Checksum
        run: |
          if [ -f "YT-Cutter-${GITHUB_REF_NAME#v}.apk" ]; then
            sha256sum "YT-Cutter-${GITHUB_REF_NAME#v}.apk" | tee sha256.txt
          else
            sha256sum app/build/outputs/apk/release/app-release.apk | tee sha256.txt
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ytcutter-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            sha256.txt

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            YT-Cutter-*.apk
            sha256.txt
