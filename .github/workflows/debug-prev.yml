name: debug-prev
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          API="https://api.github.com/repos/$GITHUB_REPOSITORY"
          LIST=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "$API/releases?per_page=3")
          ID=$(printf '%s' "$LIST" | python3 -c "import sys,json;print(next(a['id'] for r in json.load(sys.stdin) for a in r['assets'] if a['name'].endswith('.apk')))")
          echo "asset_id=$ID"
          curl -sL -o a.apk -w "asset_api=%{http_code} %{size_download}\n" -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" "$API/releases/assets/$ID"
          curl -sL -o b.apk -w "asset_api_noauth=%{http_code} %{size_download}\n" -H "Accept: application/octet-stream" "$API/releases/assets/$ID"
          curl -sL -o c.apk -w "latest_dl=%{http_code} %{size_download}\n" "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/YT-Cutter-1.0.0.apk"
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          for f in a b c; do [ -s $f.apk ] && "$AAPT" dump badging $f.apk | head -1; done
